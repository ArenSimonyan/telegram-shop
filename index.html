<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мини магазин</title>

    <!-- ОБЯЗАТЕЛЬНО для Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 15px;
        }
        .item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 6px;
            background: #2ea6ff;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h2>🛒 Мини-магазин</h2>

<div class="item">
    <b>Товар 1</b><br>
    Цена: 100₽
    <button onclick="buy('Товар 1')">Купить</button>
</div>

<div class="item">
    <b>Товар 2</b><br>
    Цена: 200₽
    <button onclick="buy('Товар 2')">Купить</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // разворачивает WebApp

    function buy(product) {
        tg.sendData(product); // отправка данных в бота
    }
</script>

</body>
</html>
