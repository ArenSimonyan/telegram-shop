<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой интернет-магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #ff6f61;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        h1 {
            margin: 0;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .product:hover {
            transform: scale(1.05);
        }
        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-details {
            padding: 15px;
        }
        .product-details h2 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
            color: #333;
        }
        .product-details p {
            margin: 0 0 10px 0;
            color: #666;
        }
        .price {
            font-weight: bold;
            color: #ff6f61;
        }
        .buy-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff6f61;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .buy-btn:hover {
            background-color: #e65b50;
        }
    </style>
</head>
<body>

<header>
    <h1>Магазин супер товаров</h1>
</header>

<section class="products">
    <div class="product">
        <img src="https://via.placeholder.com/300x200.png?text=Товар+1" alt="Товар 1">
        <div class="product-details">
            <h2>Товар 1</h2>
            <p>Описание товара 1.</p>
            <p class="price">₽1000</p>
            <a href="#" class="buy-btn">Купить</a>
        </div>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/300x200.png?text=Товар+2" alt="Товар 2">
        <div class="product-details">
            <h2>Товар 2</h2>
            <p>Описание товара 2.</p>
            <p class="price">₽1500</p>
            <a href="#" class="buy-btn">Купить</a>
        </div>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/300x200.png?text=Товар+3" alt="Товар 3">
        <div class="product-details">
            <h2>Товар 3</h2>
            <p>Описание товара 3.</p>
            <p class="price">₽2000</p>
            <a href="#" class="buy-btn">Купить</a>
        </div>
    </div>
</section>

</body>
</html>
